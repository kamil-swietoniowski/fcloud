[package]
name = "fcloud"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
reqwest = { version = "0.13.4", features = ["json"]}
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio", "macros"] 
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = "0.6.11"
